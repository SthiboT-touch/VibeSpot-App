<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go live — Nocturne</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav th:replace="~{fragments/layout :: nav}"></nav>

<main>
    <section class="section container" style="max-width: 560px;">
        <span class="badge badge-live"><span class="dot"></span> LIVE</span>
        <h1 style="font-size: 28px; margin-top: 14px;">Go live</h1>
        <p style="margin-top: 8px;">Broadcast that you're at a venue right now so people can find you. This demo posts a marked "live" entry to the feed — no real video.</p>

        <div class="card" style="margin-top: 24px;">
            <form th:action="@{/go-live}" method="post">
                <div class="field">
                    <label for="venueName">Where are you?</label>
                    <input type="text" id="venueName" name="venueName" placeholder="e.g. Subline" required>
                </div>
                <div class="field">
                    <label for="caption">Say something to the feed</label>
                    <textarea id="caption" name="caption" rows="3" placeholder="We're here, floor's already moving..." required></textarea>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Go live now</button>
            </form>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
